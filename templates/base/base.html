{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ResumeGuru</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">

        <a class="navbar-brand logo-text" href="{% url 'home' %}">
            ResumeGuru
        </a>

        <button class="navbar-toggler" type="button" id="mobileMenuBtn">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-menu" id="navbarMenu">
            {% if user.is_authenticated %}
                <a class="nav-btn" href="{% url 'home' %}">Home</a>
                <a class="nav-btn" href="{% url 'create_resume' %}">Create Resume</a>
                <a class="nav-btn" href="{% url 'my_library' %}">My Library</a>
                <a class="nav-btn" href="{% url 'ats_score' %}">ATS Score</a>
                <a class="nav-btn logout-btn" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="nav-btn" href="{% url 'resume_samples' %}">Samples</a>
                <a class="nav-btn" href="{% url 'resume_templates' %}">Templates</a>
                <a class="nav-btn" href="{% url 'login' %}">Login</a>
                <a class="nav-btn register-btn" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>

    </div>
</nav>

<div class="main-wrapper">

    {% if messages %}
        <div class="message-box">
            {% for message in messages %}
                <div class="alert alert-info custom-alert">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
