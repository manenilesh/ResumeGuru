{% extends 'base/base.html' %}

{% block content %}

<h2>Create Resume</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label>Resume Title</label>
        <input type="text" name="title" class="form-control" placeholder="Software Developer Resume" required>
    </div>

    <div class="mb-3">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Address</label>
        <textarea name="address" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label>Professional Summary</label>
        <textarea name="summary" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
        <label>Skills</label>
        <textarea name="skills" class="form-control" placeholder="Python, Django, MySQL, HTML, CSS" required></textarea>
    </div>

    <div class="mb-3">
        <label>Experience</label>
        <textarea name="experience" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
        <label>Education</label>
        <textarea name="education" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
        <label>Projects</label>
        <textarea name="projects" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label>Select Template</label>
        <select name="template" class="form-control">
            <option value="classic">Classic</option>
            <option value="modern">Modern</option>
            <option value="professional">Professional</option>
        </select>
    </div>

    <button class="btn btn-primary">Save Resume</button>
</form>

{% endblock %}
